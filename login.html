<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Login - Battle of Knowledge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles/animations.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Baloo 2', cursive; 
            background: linear-gradient(to bottom right, #fef3c7, #fde68a, #fef3c7);
            min-height: 100vh;
        }
        
        .main-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
        }
        
        .login-bg-overlay {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
                url('assets/Background/Start Menu/Start Menu.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.6;
            z-index: 1;
        }
        
        .login-card {
            position: relative;
            z-index: 10;
            background: linear-gradient(to bottom right, rgba(254, 243, 199, 0.98), rgba(253, 230, 138, 0.98));
            backdrop-filter: blur(10px);
            border: 4px solid rgba(120, 53, 15, 0.4);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 3px solid rgba(120, 53, 15, 0.3);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            font-family: 'Baloo 2', cursive;
            color: #7c2d12;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #b45309;
            box-shadow: 0 0 0 3px rgba(180, 83, 9, 0.2);
        }
        
        .form-input::placeholder {
            color: #9ca3af;
        }
        
        .form-label {
            display: block;
            font-weight: 700;
            color: #7c2d12;
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }
        
        .btn-primary {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(to right, #b45309, #d97706);
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(180, 83, 9, 0.4);
        }
        
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid rgba(239, 68, 68, 0.3);
            color: #dc2626;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .success-message {
            background: rgba(16, 185, 129, 0.1);
            border: 2px solid rgba(16, 185, 129, 0.3);
            color: #059669;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
        }
        
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 2px;
            background: rgba(120, 53, 15, 0.2);
        }
        
        .divider span {
            padding: 0 1rem;
            color: #92400e;
            font-weight: 600;
        }
        
        .link-text {
            color: #b45309;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        
        .link-text:hover {
            color: #92400e;
            text-decoration: underline;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(120, 53, 15, 0.1);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: #92400e;
            font-size: 0.85rem;
            padding: 0.35rem 0.5rem;
            transition: all 0.2s ease;
        }

        .password-toggle:hover {
            background: rgba(120, 53, 15, 0.2);
            color: #78350f;
        }

        .btn-guest {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(to right, #6b7280, #4b5563);
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            margin-bottom: 1rem;
        }

        .btn-guest:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(107, 114, 128, 0.4);
            background: linear-gradient(to right, #4b5563, #374151);
        }

        .guest-note {
            font-size: 0.8rem;
            color: #92400e;
            text-align: center;
            margin-top: -0.5rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="login-bg-overlay"></div>
        
        <div class="login-card">
            <h1 class="text-2xl font-extrabold text-center text-amber-900 mb-1">Welcome Back!</h1>
            <p class="text-center text-amber-700 mb-6">Sign in to continue your journey</p>
            
            <!-- Error/Success Messages -->
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            
            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label for="email" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                    >
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div style="position: relative;">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                            style="padding-right: 45px;"
                        >
                        <button type="button" class="password-toggle" onclick="togglePassword('password')" id="passwordToggleBtn">
                            Show
                        </button>
                    </div>
                </div>
                
                <div class="flex justify-between items-center mb-6">
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" id="rememberMe" class="mr-2 accent-amber-600">
                        <span class="text-sm text-amber-800">Remember me</span>
                    </label>
                    <a href="#" onclick="showForgotPassword()" class="link-text text-sm">Forgot password?</a>
                </div>
                
                <button type="submit" id="loginBtn" class="btn-primary">
                    <span id="loginBtnText">Sign In</span>
                    <span id="loginSpinner" style="display: none;">⏳ Signing in...</span>
                </button>
            </form>
            
            <div class="divider">
                <span>OR</span>
            </div>

            <button type="button" class="btn-guest" onclick="playAsGuest()">
                🎮 Play as Guest
            </button>
            <p class="guest-note">⚠️ Progress won't be saved online</p>
        
            <p class="text-center text-amber-800">
                Don't have an account? 
                <a href="signup.html" class="link-text">Sign up here</a>
            </p>
        </div>
    </div>
    
    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="login-card max-w-md">
            <h2 class="text-xl font-bold text-amber-900 mb-4">Reset Password</h2>
            <p class="text-amber-700 mb-4">Enter your email address and we'll send you a link to reset your password.</p>
            
            <div id="resetError" class="error-message"></div>
            <div id="resetSuccess" class="success-message"></div>
            
            <form onsubmit="handleForgotPassword(event)">
                <div class="mb-4">
                    <label for="resetEmail" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="resetEmail" 
                        class="form-input" 
                        placeholder="Enter your email"
                        required
                    >
                </div>
                
                <div class="flex gap-3">
                    <button type="button" onclick="closeForgotPassword()" class="flex-1 py-3 border-2 border-amber-600 text-amber-700 font-bold rounded-xl hover:bg-amber-100 transition-colors">
                        Cancel
                    </button>
                    <button type="submit" class="flex-1 btn-primary">
                        Send Reset Link
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Supabase configuration
        const SUPABASE_URL = 'https://vjrgwoqbewdahoipsuqo.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqcmd3b3FiZXdkYWhvaXBzdXFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgxNDMzOTUsImV4cCI6MjA4MzcxOTM5NX0.GIrUAmehdtdG3gxnvdjO71uiz-L7yYkBStNrf9_vr3s';

        // Keep the global from CDN untouched; use a local client to avoid name collisions
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Check if already logged in - redirect to appropriate dashboard
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session }, error } = await sb.auth.getSession();
            if (session?.user) {
                // Clear any stale guest session if real user is logged in
                localStorage.removeItem('guestSession');
                
                redirectUser({
                    id: session.user.id,
                    email: session.user.email,
                    metaRole: session.user.user_metadata?.role
                });
            }
            if (error) {
                console.warn('Session lookup error:', error.message);
            }
        });
        
        // Redirect based on user role (fallback to metadata/email if profile is missing)
        async function redirectUser(userContext) {
            const userId = userContext?.id;
            const emailFromContext = userContext?.email || '';
            const metaRole = userContext?.metaRole;

            // Try to load profile role first (ignore errors)
            const { data: profile, error: profileError } = await sb
                .from('profiles')
                .select('role')
                .eq('id', userId)
                .single();

            // Heuristic fallbacks in case profile row is missing (common for legacy accounts)
            const role = profile?.role
                || metaRole
                || (emailFromContext.startsWith('admin') ? 'admin' : undefined)
                || 'student';

            if (profileError) {
                console.warn('Profile lookup error, using fallback role:', profileError.message);
            }

            const redirectMap = {
                admin: 'admin.html',
                teacher: 'teacher.html',
                student: 'menu.html'
            };
            window.location.href = redirectMap[role] || 'menu.html';
        }
        
        // Handle login form submission
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const loginBtnText = document.getElementById('loginBtnText');
            const loginSpinner = document.getElementById('loginSpinner');
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            // Reset messages
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');
            
            // Show loading state
            loginBtn.disabled = true;
            loginBtnText.style.display = 'none';
            loginSpinner.style.display = 'inline';
            
            try {
                const { data, error } = await sb.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (error) throw error;
                
                // Clear any guest session when real user logs in
                localStorage.removeItem('guestSession');
                
                successDiv.textContent = 'Login successful! Redirecting...';
                successDiv.classList.add('show');
                
                // Redirect based on role using the freshly returned session/user metadata
                const userContext = {
                    id: data.user?.id,
                    email: data.user?.email,
                    metaRole: data.user?.user_metadata?.role
                };
                setTimeout(() => {
                    redirectUser(userContext);
                }, 600);
                
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = error.message === 'Invalid login credentials' 
                    ? 'Invalid email or password. Please try again.'
                    : error.message;
                errorDiv.classList.add('show');
            } finally {
                loginBtn.disabled = false;
                loginBtnText.style.display = 'inline';
                loginSpinner.style.display = 'none';
            }
        }
        
        // Toggle password visibility
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const btn = document.getElementById(inputId + 'ToggleBtn');
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'Hide';
            } else {
                input.type = 'password';
                btn.textContent = 'Show';
            }
        }
        
        // Show forgot password modal
        function showForgotPassword() {
            document.getElementById('forgotPasswordModal').classList.remove('hidden');
            document.getElementById('resetError').classList.remove('show');
            document.getElementById('resetSuccess').classList.remove('show');
        }
        
        // Close forgot password modal
        function closeForgotPassword() {
            document.getElementById('forgotPasswordModal').classList.add('hidden');
        }
        
        // Handle forgot password
        async function handleForgotPassword(event) {
            event.preventDefault();
            
            const email = document.getElementById('resetEmail').value.trim();
            const errorDiv = document.getElementById('resetError');
            const successDiv = document.getElementById('resetSuccess');
            
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');
            
            try {
                const { error } = await sb.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/reset-password.html'
                });
                
                if (error) throw error;
                
                successDiv.textContent = 'Password reset link sent! Check your email.';
                successDiv.classList.add('show');
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.add('show');
            }
        }
        
        // Close modal on outside click
        document.getElementById('forgotPasswordModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('forgotPasswordModal')) {
                closeForgotPassword();
            }
        });

        // Play as Guest
        async function playAsGuest() {
            // Clear any existing auth session first (wait for it to complete)
            await sb.auth.signOut();
            
            // Set guest session in localStorage
            const guestSession = {
                isGuest: true,
                guestId: 'guest_' + Date.now(),
                startedAt: new Date().toISOString()
            };
            localStorage.setItem('guestSession', JSON.stringify(guestSession));
            
            // Redirect to menu
            window.location.href = 'menu.html';
        }
    </script>
</body>
</html>
