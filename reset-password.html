<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Reset Password - Battle of Knowledge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles/animations.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Baloo 2', cursive; 
            background: linear-gradient(to bottom right, #fef3c7, #fde68a, #fef3c7);
            min-height: 100vh;
        }
        
        .main-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
        }
        
        .reset-bg-overlay {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
                url('assets/Background/Start Menu/Start Menu.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.6;
            z-index: 1;
        }
        
        .reset-card {
            position: relative;
            z-index: 10;
            background: linear-gradient(to bottom right, rgba(254, 243, 199, 0.98), rgba(253, 230, 138, 0.98));
            backdrop-filter: blur(10px);
            border: 4px solid rgba(120, 53, 15, 0.4);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 3px solid rgba(120, 53, 15, 0.3);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            font-family: 'Baloo 2', cursive;
            color: #7c2d12;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #b45309;
            box-shadow: 0 0 0 3px rgba(180, 83, 9, 0.2);
        }
        
        .form-label {
            display: block;
            font-weight: 700;
            color: #7c2d12;
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }
        
        .btn-primary {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(to right, #b45309, #d97706);
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(180, 83, 9, 0.4);
        }
        
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid rgba(239, 68, 68, 0.3);
            color: #dc2626;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .success-message {
            background: rgba(16, 185, 129, 0.1);
            border: 2px solid rgba(16, 185, 129, 0.3);
            color: #059669;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(120, 53, 15, 0.1);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: #92400e;
            font-size: 0.85rem;
            padding: 0.35rem 0.5rem;
            transition: all 0.2s ease;
        }

        .password-toggle:hover {
            background: rgba(120, 53, 15, 0.2);
            color: #78350f;
        }

        .password-requirements {
            font-size: 0.8rem;
            color: #92400e;
            margin-top: 0.5rem;
        }
        
        .lang-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .lang-toggle:hover {
            transform: scale(1.1);
        }
        
        .lang-toggle img {
            height: 40px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
    </style>
</head>
<body>
    <!-- Language Toggle -->
    <button id="langToggle" class="lang-toggle" aria-label="Toggle Language">
        <img id="langToggleImg" src="assets/Buttons/TAGALOG BUTTON.png" alt="Switch to Tagalog">
    </button>
    
    <div class="main-container">
        <div class="reset-bg-overlay"></div>
        
        <div class="reset-card">
            <h1 class="text-2xl font-extrabold text-center text-amber-900 mb-1" data-translate="Reset Password">🔐 Reset Password</h1>
            <p class="text-center text-amber-700 mb-6">Enter your new password below</p>
            
            <!-- Error/Success Messages -->
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            
            <!-- Reset Password Form -->
            <form id="resetForm" onsubmit="handleResetPassword(event)">
                <div class="mb-4">
                    <label for="newPassword" class="form-label">New Password</label>
                    <div style="position: relative;">
                        <input 
                            type="password" 
                            id="newPassword" 
                            name="newPassword" 
                            class="form-input" 
                            placeholder="Enter new password"
                            required
                            minlength="6"
                            style="padding-right: 45px;"
                        >
                        <button type="button" class="password-toggle" onclick="togglePassword('newPassword')" id="newPasswordToggleBtn">
                            Show
                        </button>
                    </div>
                    <p class="password-requirements">At least 6 characters</p>
                </div>
                
                <div class="mb-6">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <div style="position: relative;">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            class="form-input" 
                            placeholder="Confirm new password"
                            required
                            minlength="6"
                            style="padding-right: 45px;"
                        >
                        <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')" id="confirmPasswordToggleBtn">
                            Show
                        </button>
                    </div>
                </div>
                
                <button type="submit" id="resetBtn" class="btn-primary">
                    <span id="resetBtnText">Update Password</span>
                    <span id="resetSpinner" style="display: none;">⏳ Updating...</span>
                </button>
            </form>
            
            <p class="text-center text-amber-800 mt-6">
                <a href="login.html" class="text-amber-600 font-semibold hover:underline">← Back to Login</a>
            </p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://bthyqczptljdhmioagpl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0aHlxY3pwdGxqZGhtaW9hZ3BsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgzOTY2NzAsImV4cCI6MjA4Mzk3MjY3MH0.QKFZapzgWYcCtuw3eEvqg6U6qi06QNpvIRNBw7ABf9I';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Toggle password visibility
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const btn = document.getElementById(inputId + 'ToggleBtn');
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'Hide';
            } else {
                input.type = 'password';
                btn.textContent = 'Show';
            }
        }
        
        // Handle password reset
        async function handleResetPassword(event) {
            event.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const resetBtn = document.getElementById('resetBtn');
            const resetBtnText = document.getElementById('resetBtnText');
            const resetSpinner = document.getElementById('resetSpinner');
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            // Reset messages
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');
            
            // Validate passwords match
            if (newPassword !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match.';
                errorDiv.classList.add('show');
                return;
            }
            
            // Show loading state
            resetBtn.disabled = true;
            resetBtnText.style.display = 'none';
            resetSpinner.style.display = 'inline';
            
            try {
                const { error } = await sb.auth.updateUser({
                    password: newPassword
                });
                
                if (error) throw error;
                
                successDiv.textContent = 'Password updated successfully! Redirecting to login...';
                successDiv.classList.add('show');
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                
            } catch (error) {
                console.error('Reset password error:', error);
                errorDiv.textContent = error.message || 'Failed to reset password. Please try again.';
                errorDiv.classList.add('show');
            } finally {
                resetBtn.disabled = false;
                resetBtnText.style.display = 'inline';
                resetSpinner.style.display = 'none';
            }
        }
        
        // Check if user has a valid session (came from reset link)
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) {
                document.getElementById('errorMessage').textContent = 'Invalid or expired reset link. Please request a new one.';
                document.getElementById('errorMessage').classList.add('show');
                document.getElementById('resetForm').style.display = 'none';
            }
        });
    </script>
    <script src="js/language.js"></script>
</body>
</html>
